@SERIAL_CONFIG@
@TERMINAL_CONFIG@

set default="0"
set timeout="@TIMEOUT@"

menuentry "@TITLE@" {
	search --set=root --label kernel
	linux /efi/openwrt/Image @GPT_ROOTPART@ @CMDLINE@ noinitrd
	devicetree /efi/openwrt/@DEVICE_DTS@.dtb
}
menuentry "@TITLE@ (DT from bootloader)" {
	search --set=root --label kernel
	linux /efi/openwrt/Image @GPT_ROOTPART@ @CMDLINE@ noinitrd
}

menuentry "@TITLE@ (failsafe)" {
	search --set=root --label kernel
	linux /efi/openwrt/Image failsafe=true @GPT_ROOTPART@ @CMDLINE@ noinitrd
	devicetree /efi/openwrt/@DEVICE_DTS@.dtb
}
